<div class="container mt-5">
  <h2 class="fw-bold mb-4">Contact Us</h2>

  @if (submitted) {
  <div class="alert alert-success">
    Thank you, {{ name }}! Your message has been sent.
  </div>
  } @else {

  <div class="mb-3">
    <label class="form-label">Name</label>
    <input [(ngModel)]="name" type="text" class="form-control" placeholder="Your name" />
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input [(ngModel)]="email" type="email" class="form-control" placeholder="you@example.com" />
  </div>

  <div class="mb-3">
    <label class="form-label">Message</label>
    <textarea [(ngModel)]="message" class="form-control" rows="4" placeholder="Write your message..."></textarea>
  </div>

  <button (click)="submit()" class="btn btn-primary">Send</button>

  }
</div>
