<div class="container mt-5">
    <h2 class="fw-bold mb-4 text-danger">
        Delete Department
    </h2>

    @if (dept) {

    <div class="alert alert-warning">
        <p>Are you sure you want to delete this department?</p>

        <ul>
            <li><strong>ID:</strong> {{ dept.id }}</li>
            <li><strong>Name:</strong> {{ dept.name }}</li>
            <li><strong>Location:</strong> {{ dept.location }}</li>
        </ul>
    </div>

    <button (click)="confirmDelete()" class="btn btn-danger me-2">
        Yes, Delete
    </button>

    <a routerLink="/departments" class="btn btn-secondary">
        Cancel
    </a>

    } @else {

    <p class="text-muted">Department not found.</p>

    <a routerLink="/departments" class="btn btn-secondary">
        Back
    </a>

    }
</div>
