<div class="container mt-5">
  <h2 class="fw-bold mb-4">Edit Department</h2>

  <div class="mb-3">
    <label class="form-label" for="deptId">ID</label>
    <input [(ngModel)]="dept.DeptId" type="number" class="form-control" id="deptId" disabled />
  </div>
  <div class="mb-3">
    <label class="form-label" for="deptName">Name</label>
    <input [(ngModel)]="dept.DeptName" type="text" class="form-control" id="deptName" />
  </div>
  <div class="mb-3">
    <label class="form-label" for="deptLocation">Location</label>
    <input [(ngModel)]="dept.DeptLocation" type="text" class="form-control" id="deptLocation" />
  </div>

  <button (click)="save()" class="btn btn-warning me-2">Update</button>
  <a routerLink="/departments" class="btn btn-secondary">Cancel</a>
</div>
