<div class="container mt-5">
    <h2 class="fw-bold mb-4">Department List</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Location</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            @for (department of departments; track department.id; let i = $index) {
            <tr [ngClass]="i % 2 === 0 ? 'table-light' : 'table-secondary'">
                <td>{{ department.id }}</td>
                <td>{{ department.name }}</td>
                <td>{{ department.location }}</td>
                <td>
                    <a routerLink="/departments/edit/{{ department.id }}" class="btn btn-sm btn-warning me-2">
                        Edit
                    </a>
                    <a routerLink="/departments/delete/{{ department.id }}" class="btn btn-sm btn-danger me-2">
                        Delete
                    </a>
                    <a routerLink="/departments/details/{{ department.id }}" class="btn btn-sm btn-info me-2">
                        Details
                    </a>
                </td>
            </tr>
            } @empty {
            <tr>
                <td colspan="4">No departments found.</td>
            </tr>
            }
        </tbody>
    </table>

    <a routerLink="/departments/add" class="btn btn-primary">Add Department</a>
</div>
