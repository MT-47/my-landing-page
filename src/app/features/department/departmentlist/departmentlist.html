<div class="container mt-5">
  <h2 class="fw-bold mb-4">Department List</h2>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Location</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (department of departments; track department.DeptId; let i = $index) {
      <tr [ngClass]="i % 2 === 0 ? 'table-light' : 'table-secondary'">
        <td>{{ department.DeptId }}</td>
        <td>{{ department.DeptName }}</td>
        <td>{{ department.DeptLocation }}</td>
        <td>
          <a routerLink="/departments/edit/{{ department.DeptId }}" class="btn btn-sm btn-warning me-2">Edit</a>
          <a routerLink="/departments/delete/{{ department.DeptId }}" class="btn btn-sm btn-danger me-2">Delete</a>
          <a routerLink="/departments/details/{{ department.DeptId }}" class="btn btn-sm btn-info me-2">Details</a>
        </td>
      </tr>
      }
      @empty {
      <tr><td colspan="4">No departments found.</td></tr>
      }
    </tbody>
  </table>

  <a routerLink="/departments/add" class="btn btn-primary">Add Department</a>
  <router-outlet></router-outlet>
</div>
