<div class="container mt-5">
  <h2 class="fw-bold mb-4">Add Student</h2>

  <div class="mb-3">
    <label class="form-label" for="studentId" >ID</label>
    <input [(ngModel)]="std.StId" type="number" class="form-control" id="studentId"/>
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentFname" >First Name</label>
    <input [(ngModel)]="std.StFname" type="text" class="form-control" id="studentFname"/>
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentLname" >Last Name</label>
    <input [(ngModel)]="std.StLname" type="text" class="form-control" id="studentLname"/>
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentAge" >Age</label>
    <input [(ngModel)]="std.StAge" type="number" class="form-control" id="studentAge"/>
  </div>

  <button (click)="add()" class="btn btn-success me-2">Save</button>
  <a routerLink="/students" class="btn btn-secondary">Cancel</a>
</div>
