<div class="container mt-5">
  <h2 class="fw-bold mb-4 text-danger">Delete Student</h2>

  @if (std) {
  <div class="alert alert-warning">
    <p>Are you sure you want to delete this student?</p>
    <ul>
      <li><strong>ID:</strong> {{ std.StId }}</li>
      <li><strong>Name:</strong> {{ std.StFname }} {{ std.StLname }}</li>
      <li><strong>Age:</strong> {{ std.StAge }}</li>
    </ul>
  </div>
  <button (click)="confirmDelete()" class="btn btn-danger me-2">Yes, Delete</button>
  <a routerLink="/students" class="btn btn-secondary">Cancel</a>
  } @else {
  <p class="text-muted">Student not found.</p>
  <a routerLink="/students" class="btn btn-secondary">Back</a>
  }
</div>
