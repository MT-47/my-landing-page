<div class="container mt-5">
  <h2 class="fw-bold mb-4">Edit Student</h2>

  <div class="mb-3">
    <label for="studentId" class="form-label">ID</label>
    <input
      id="studentId"
      name="studentId"
      [(ngModel)]="std.id"
      type="number"
      class="form-control"
      disabled
    />
  </div>

  <div class="mb-3">
    <label for="studentName" class="form-label">Name</label>
    <input
      id="studentName"
      name="studentName"
      [(ngModel)]="std.name"
      type="text"
      class="form-control"
    />
  </div>

  <div class="mb-3">
    <label for="studentAge" class="form-label">Age</label>
    <input
      id="studentAge"
      name="studentAge"
      [(ngModel)]="std.age"
      type="number"
      class="form-control"
    />
  </div>

  <button (click)="save()" class="btn btn-warning me-2">
    Update
  </button>

  <a routerLink="/students" class="btn btn-secondary">
    Cancel
  </a>
</div>
