<div class="container mt-5">
  <h2 class="fw-bold mb-4">Edit Student</h2>

  <div class="mb-3">
    <label class="form-label" for="studentId">ID</label>
    <input id="studentId" [(ngModel)]="std.StId" type="number" class="form-control" disabled />
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentFname">First Name</label>
    <input id="studentFname" [(ngModel)]="std.StFname" type="text" class="form-control" />
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentLname">Last Name</label>
    <input id="studentLname" [(ngModel)]="std.StLname" type="text" class="form-control" />
  </div>
  <div class="mb-3">
    <label class="form-label" for="studentAge">Age</label>
    <input id="studentAge" [(ngModel)]="std.StAge" type="number" class="form-control" />
  </div>

  <button (click)="save()" class="btn btn-warning me-2">Update</button>
  <a routerLink="/students" class="btn btn-secondary">Cancel</a>
</div>
