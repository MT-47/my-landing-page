<div class="container mt-5">
    <h2 class="mb-4">Student List</h2>

    <p-table [value]="students" [tableStyle]="{'min-width':'50rem'}" stripedRows>
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-student>
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>

                <td>
                    <a routerLink="/students/edit/{{student.id}}" class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <a routerLink="/students/delete/{{student.id}}" class="btn btn-danger btn-sm me-2">
                        Delete
                    </a>
                    <a routerLink="/students/details/{{student.id}}" class="btn btn-info btn-sm me-2">
                        Details
                    </a>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <a routerLink="/students/add" class="btn btn-primary mt-3">
        Add Student
    </a>
</div>
