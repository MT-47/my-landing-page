<div class="container mt-5">
  <h2 class="fw-bold mb-4">Student List</h2>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Age</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (student of students; track student.StId; let i = $index) {
      <tr [ngClass]="i % 2 === 0 ? 'table-light' : 'table-secondary'">
        <td>{{ student.StId }}</td>
        <td>{{ student.StFname }}</td>
        <td>{{ student.StLname }}</td>
        <td>{{ student.StAge }}</td>
        <td>
          <a routerLink="/students/edit/{{ student.StId }}" class="btn btn-sm btn-warning me-2">Edit</a>
          <a routerLink="/students/delete/{{ student.StId }}" class="btn btn-sm btn-danger me-2">Delete</a>
          <a routerLink="/students/details/{{ student.StId }}" class="btn btn-sm btn-info me-2">Details</a>
        </td>
      </tr>
      }
      @empty {
      <tr><td colspan="5">No students found.</td></tr>
      }
    </tbody>
  </table>

  <a routerLink="/students/add" class="btn btn-primary">Add Student</a>
</div>
<router-outlet></router-outlet>
