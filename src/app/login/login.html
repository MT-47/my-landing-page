<div class="container mt-5 login-container">
  <h2 class="fw-bold mb-4">Login</h2>

  <div class="mb-3">
    <label class="form-label">Username</label>
    <input [(ngModel)]="username" type="text" class="form-control" placeholder="Enter username" />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input [(ngModel)]="password" type="password" class="form-control" placeholder="Enter password" />
  </div>

  @if (error) {
  <div class="alert alert-danger">{{ error }}</div>
  }

  <button (click)="login()" class="btn btn-primary w-100">Login</button>

  <p class="text-center mt-3">
    Don't have an account?
    <a routerLink="/register">Register</a>
  </p>
</div>
